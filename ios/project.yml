name: CarRanksApp
options:
  minimumXcodeGenVersion: 2.44.0
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
targets:
  CarRanksApp:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: CarRanksApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.albinocordeiro.carranks
        INFOPLIST_FILE: CarRanksApp/Info.plist
        API_BASE_URL: http://127.0.0.1:8080
        DEFAULT_X_USER_ID: 06b3fff1-bfcc-4cda-840b-d512963bc239
        DEFAULT_VEHICLE_UID: e11889bf-504c-4238-9583-bc8840f20e19
  CarRanksAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - CarRanksAppTests
      - path: CarRanksApp/Fixtures
        buildPhase: resources
    dependencies:
      - target: CarRanksApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.albinocordeiro.carranks.tests
        GENERATE_INFOPLIST_FILE: YES
  CarRanksAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - CarRanksAppUITests
    dependencies:
      - target: CarRanksApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.albinocordeiro.carranks.uitests
        GENERATE_INFOPLIST_FILE: YES
